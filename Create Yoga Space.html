<div class="card"><h3>Styles of yoga</h3><details><summary><b>Vinyasa</b></summary><p>Breath-linked, flowing sequences that change every class; sun salutations are the backbone.</p></details><details><summary><b>Ashtanga</b></summary><p>A set sequence (Primary, Intermediate, Advanced series) practised in the same order each time. Mysore style means self-paced practice of the memorized sequence, about five breaths per pose, with a teacher adjusting you one-on-one.</p></details><details><summary><b>Bikram</b></summary><p>A fixed series of 26 postures (24 poses plus 2 breathing exercises), usually taught in a heated room: Pranayama deep breathing, Half Moon, Awkward, Eagle, Standing Head-to-Knee, Standing Bow, Balancing Stick, Standing Separate-Leg Stretching, Triangle, Separate-Leg Head-to-Knee, Tree, Toe Stand, Dead Body, Wind-Removing, Sit-up, Cobra, Locust, Full Locust, Bow, Fixed Firm, Half Tortoise, Camel, Rabbit, Head-to-Knee with Stretching, Spine Twisting, Kapalbhati breathing.</p></details><details><summary><b>Iyengar</b></summary><p>Precise alignment, longer holds and props such as blocks, straps and bolsters; good for rehab and beginners.</p></details></div><div class="card"><h3>Benefits of yoga</h3>${B.map(x=>`<details><summary><b>${x[0]}</b></summary><p>${x[1]}</p></details>`).join('')}</div>
